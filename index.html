function allocationError(u){
 if(!u)return 'Controller ID not found in Ready Inventory.';

 if(u.assigned)return 'This controller is already allocated to '+(u.shipmentId||'a shipment')+'.';
 if(!u.ready||!u.seal||u.hold)return 'Controller is not available in confirmed Ready Inventory. Complete its packing/review first.';

 if(planned.length&&!planned.some(l=>l.t===u.t&&l.sku===T[u.t].sku&&assigned(l.id)<l.qty))return 'This Ready controller does not match an open requirement on this SO/PO.';
 return '';
}
function autoAssignController(u){

 S.assignLogs.unshift(u.mac+' added to '+sh.id+' from confirmed Ready Inventory; '+T[u.t].id+' retained');

function openPackJob(id){if(!PACK_JOBS.some(j=>j.id===id))return;S.jobId=id;S.jobMessage='';go('packjob')}
function packJobDetails(){const j=packJob(),c=jobCounts(j),assets=REGISTERED_DEMO_ASSETS.filter(a=>a.sku===T[j.t].sku&&!units.some(u=>u.mac===a.mac));return head('Pack Job Details',`${j.id} · ${T[j.t].sku}`,btn('All Pack Jobs',"go('packjobs')"))+`<section class="card"><div class="fields"><div><label>Approved checklist</label><div class="value">${esc(T[j.t].name)}<div class="muted mono">${T[j.t].id} / ${T[j.t].revision}</div></div></div><div><label>Target quantity</label><div class="value">${j.target}</div></div><div><label>Status</label><div class="value">${tag(c.status,c.status==='Complete'?'green':c.hold?'amber':'gray')}</div></div><div><label>Production reference</label><div class="value">${esc(j.ref)||'—'}</div></div></div></section><section class="card"><div class="cardhead"><h2>Add Controller</h2><span class="muted">${c.us.length} / ${j.target} controllers added · ${c.ready} Ready</span></div><label for="jobController">Scan Controller ID (MAC ID)</label><div style="display:flex;gap:10px"><input id="jobController" class="scan" placeholder="e.g. 020000000006" onkeydown="if(event.key==='Enter'||(event.key==='Tab'&&this.value.trim())){event.preventDefault();addJobController(this.value)}" ${!canPack()||c.us.length>=j.target?'disabled':''}>${btn('Add controller',"addJobController($('jobController').value)",'blue',!canPack()||c.us.length>=j.target)}</div><div class="message ${S.jobClass||''}" aria-live="polite">${esc(S.jobMessage||'Scan a registered controller. A new packing session starts with zero required scans completed.')}</div><details style="margin-top:14px"><summary>Registered demo controllers for this SKU</summary><div class="chips" style="margin-top:12px">${assets.map(a=>btn(a.mac,`addJobController('${a.mac}')`,'',!canPack()||c.us.length>=j.target)).join('')||'<span class="muted">All sample controllers for this SKU are already in jobs.</span>'}</div><p class="muted">These are sample asset records for trying the demo; production looks up controllers in AMP.</p></details></section><section class="card"><div class="cardhead"><h2>Controllers in ${j.id}</h2>${tag('One scan session per controller')}</div><div class="tablewrap"><table><thead><tr><th>Controller ID (MAC ID)</th><th>Controller serial</th><th>Required scans</th><th>Readiness</th><th>Verified & marked Ready by</th><th></th></tr></thead><tbody>${c.us.map(u=>{const ses=sessions[u.id],need=requirements(u.t).filter(b=>b.req==='Y'),got=ses?need.reduce((n,b)=>n+Math.min(ses.counts[b.pn]||0,b.qty),0):u.ready||u.shipped?need.reduce((n,b)=>n+b.qty,0):0,total=need.reduce((n,b)=>n+b.qty,0);return `<tr><td class="mono">${u.mac}</td><td class="mono">${u.serial}</td><td>${got} / ${total}</td><td>${tag(u.shipped?'Shipped':u.ready?'Ready':u.hold||'In Progress',u.ready?'green':u.hold?'amber':'gray')}</td><td>${readyVerifierCell(u)}</td><td>${u.shipped?'':btn('Open packing',`openPacking('${u.id}')`,'blue')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Add a controller to start packing.</td></tr>'}</tbody></table></div></section>${footer('02B')}`}
function emptyPackingSession(t){const ses=seed(t);Object.keys(ses.counts).forEach(k=>{ses.counts[k]=0;ses.actual[k]={}});ses.events=[];ses.done=false;return ses}
function addJobController(raw){if(!canPack())return;const j=packJob(),mac=norm(raw),asset=REGISTERED_DEMO_ASSETS.find(a=>a.mac===mac),existing=units.find(u=>u.mac===mac);let error='';if(!/^[0-9A-F]{12}$/.test(mac))error='Enter a valid 12-character Controller MAC ID.';else if(existing)error=existing.jobId===j.id?'Controller is already in this pack job.':'Controller is already assigned to another job or inventory record.';else if(jobUnits(j).length>=j.target)error='This job already has its target number of controllers.';else if(!asset)error='Controller is not in the demo asset registry. Use a listed sample Controller ID.';else if(asset.sku!==T[j.t].sku)error='Controller SKU does not match this job.';else if(checklistStatus(T[j.t])!=='Approved')error='This job requires an approved checklist.';if(error){S.jobMessage=error;S.jobClass='bad'}else{units.push({id:asset.id,serial:asset.serial,mac,t:j.t,jobId:j.id,ready:false,seal:false,assigned:null,hold:null,readyVerification:null,readyHistory:[]});sessions[asset.id]=emptyPackingSession(j.t);S.jobMessage=mac+' added. Open packing to scan its required parts.';S.jobClass='ok'}render();$('jobController')?.focus()}
function openPacking(id){const u=units.find(u=>u.id===id);if(!u)return;S.activeUnit=id;S.jobId=u.jobId||S.jobId;S.sealed=u.seal;S.onlyMissing=false;S.scanMessage='Scan a part barcode. Approved equivalents count toward the same requirement.';S.scanClass='';go('packing')}
function quickScanHelp(u){return `<div class="note"><b>Three-scan walkthrough:</b> add one primary cable, one equivalent cable and one packing label. You can scan/type the codes above, or use these sample buttons.<div class="actions" style="margin-top:8px">${['99G33-19B73C6','PC71-RADINTC-10M','DEMO-PACK-LABEL'].map(p=>btn(p,`scanPart('${p}')`,'',!canPack()||u.ready)).join('')}</div></div>`}
function saveProgress(){toast(persistDemoState()?'Progress saved in this browser.':'Progress remains in this tab; browser storage is unavailable.')}
function persistDemoState(){try{localStorage.setItem(DEMO_STORAGE_KEY,JSON.stringify({schema:1,savedAt:new Date().toISOString(),templates:T,units,sessions,shipments:SHIPMENTS,jobs:PACK_JOBS,ui:{activeUnit:S.activeUnit,jobId:S.jobId,shipmentId:S.shipmentId,role:S.role,serialHold:S.serialHold,sealed:S.sealed,logs:S.logs,assignLogs:S.assignLogs}}));return true}catch{return false}}
function restoreDemoState(){try{const d=JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY)||'null');if(!d||d.schema!==1||!Array.isArray(d.units)||!Array.isArray(d.jobs)||!Array.isArray(d.shipments)||!d.templates||!d.templates.DEMO_SCAN||!d.sessions)return false;const safeId=/^[A-Za-z0-9_-]+$/;if(!d.units.every(u=>safeId.test(u.id)&&/^[0-9A-F]{12}$/.test(u.mac)&&d.templates[u.t])||!d.jobs.every(j=>safeId.test(j.id)&&d.templates[j.t]&&Number.isSafeInteger(j.target)&&j.target>0)||!d.shipments.every(sh=>safeId.test(sh.id)&&Array.isArray(sh.lines)))return false;Object.keys(T).forEach(k=>delete T[k]);Object.assign(T,d.templates);units.splice(0,units.length,...d.units);PACK_JOBS.splice(0,PACK_JOBS.length,...d.jobs);SHIPMENTS.splice(0,SHIPMENTS.length,...d.shipments);Object.keys(sessions).forEach(k=>delete sessions[k]);Object.assign(sessions,d.sessions);if(d.ui){for(const key of ['activeUnit','jobId','shipmentId','serialHold','sealed','logs','assignLogs'])if(d.ui[key]!==undefined)S[key]=d.ui[key];if(DEMO_ACTORS[d.ui.role])S.role=d.ui.role}if(!units.some(u=>u.id===S.activeUnit))S.activeUnit=units[0].id;if(!PACK_JOBS.some(j=>j.id===S.jobId))S.jobId=PACK_JOBS[0].id;if(!SHIPMENTS.some(sh=>sh.id===S.shipmentId))S.shipmentId=SHIPMENTS[0].id;lines=selectedShipment().lines;S.restored=true;return true}catch{return false}}
function resetDemo(){if(!confirm('Reset this browser’s demo jobs, scans, checklists and shipments?'))return;try{localStorage.removeItem(DEMO_STORAGE_KEY)}catch{}location.reload()}

function packStats(){let ses=current();let needed=requirements(unit().t).filter(b=>b.req==='Y');let missing=needed.filter(b=>(ses.counts[b.pn]||0)<b.qty);let got=needed.reduce((v,b)=>v+Math.min(ses.counts[b.pn]||0,b.qty),0);return {missing,got,total:needed.reduce((s,b)=>s+b.qty,0)}}

`<section class="card"><div class="fields"><div><label>Controller Serial</label><div class="value mono">${u.serial}</div></div><div><label>MAC Address</label><div class="value mono">${u.mac}</div></div><div><label>Packing Checklist</label><div class="value">${T[u.t].id} · ${T[u.t].revision}</div></div><div><label>${u.ready?'Verified &amp; marked Ready by':'Current operator'}</label><div class="value">${u.ready?readyVerifierCell(u):esc(currentActor().name)}</div></div></div><div class="note amber">${hasSerialHold()?'Serial change awaiting Operations review. Scanning may continue; release remains blocked.':u.hold?'Reopened box: record rework and repeat the full checklist before release.':'Component review complete. Continue required scans and sealing.'} ${btn('View review',"go('history')",'link')}</div></section>
<div class="grid two"><div><section class="card"><label for="scan">Scan packing part barcode</label><input id="scan" class="scan" placeholder="Try PC71-RADINTC-10M" onkeydown="if(event.key==='Enter'||(event.key==='Tab'&&this.value.trim())){event.preventDefault();scanPart(this.value);this.value=''}" ${!canPack()||u.ready?'disabled':''}><div class="actions" style="margin-top:8px">${btn('Add scan',"scanPart($('scan').value)",'blue',!canPack()||u.ready)}</div>${T[u.t].demoOnly?quickScanHelp(u):''}<div class="message ${S.scanClass}" aria-live="polite">${esc(S.scanMessage)}</div><div class="progress"><div style="width:${st.got/st.total*100}%"></div></div><div class="stats"><span>Required scans: ${st.got} / ${st.total}</span><span>${st.missing.length} missing requirement(s)</span></div></section>
<section class="card"><div class="cardhead"><h2>Unit Packing Checklist</h2><div class="actions"><label class="check"><input type="checkbox" ${S.onlyMissing?'checked':''} onchange="S.onlyMissing=this.checked;render()">Missing only</label>${btn('Undo last','undoScan()','',!canPack()||!ses.events.length||u.ready)}</div></div><div class="tablewrap scrolling"><table><thead><tr><th class="sticky">Part No. / Description</th><th class="sticky">Verification</th><th class="sticky num">Req</th><th class="sticky num">Done</th><th class="sticky">Actual P/N Scanned</th><th class="sticky">Status</th></tr></thead><tbody>${rows.map(b=>{const n=ses.counts[b.pn]||0,actual=Object.entries(ses.actual[b.pn]||{}).map(([p,n])=>`${p} ×${n}`).join('<br>');return `<tr><td><span class="mono">${esc(b.pn)}</span><div class="muted">${esc(b.desc)}</div>${b.alias?btn('View equivalents',`equivalents('${b.pn}')`,'link'):''}</td><td>${b.req==='Y'?'Barcode scan':'Upstream check'}${b.req==='N'?'<div class="tiny">Demo evidence</div>':''}</td><td class="num">${b.qty}</td><td class="num">${b.req==='Y'?n:'✓'}</td><td class="mono">${actual||'—'}</td><td>${b.req==='N'?tag('Verified','gray'):n===b.qty?tag('Complete','green'):tag('Missing '+(b.qty-n),'amber')}</td></tr>`}).join('')}</tbody></table></div><div class="tiny" style="margin-top:10px">13 source lines marked “No need to scan” are illustrated as upstream-verified. The production mapping requires Operations approval.</div></section></div>
<div><section class="card"><div class="cardhead"><h2>Packing Completion</h2>${tag(u.ready?'Ready':'In Progress',u.ready?'green':'amber')}</div><div class="summaryrow"><span>Required scans</span><b>${st.got} / ${st.total}</b></div><div class="summaryrow"><span>Upstream checks</span><b>${requirements(u.t).filter(b=>b.req==='N').length} / ${requirements(u.t).filter(b=>b.req==='N').length} <span class="tiny">demo</span></b></div><div class="summaryrow"><span>Serial review</span>${tag(hasSerialHold()?'Pending':'Confirmed',hasSerialHold()?'amber':'green')}</div><div class="summaryrow"><span>Order assignment</span><span>${u.assigned||'Unassigned'}</span></div><label class="check" style="margin-top:18px"><input id="seal" type="checkbox" ${S.sealed?'checked':''} ${!canPack()?'disabled':''} onchange="S.sealed=this.checked;render()">Contents verified; box sealed</label><div style="margin-top:16px">${btn('Verify & Mark Ready','completePack()','dark',!canPack()||!!blocked||u.ready)}</div><div class="muted" style="margin-top:12px">${st.missing.length?'Missing required parts prevent completion. ':''}${hasSerialHold()?'Resolve the serial review before release. ':''}${!S.sealed?'Confirm sealing.':''}</div></section>
<section class="card"><h2 style="font-size:16px;margin-top:0">Scan Log</h2><div class="log">${ses.events.slice().reverse().map(x=>`<div class="event"><span class="tiny">${x.time} · ${esc(x.actorName||'Demo Operator')}</span><br><span class="mono">${esc(x.actual)}</span><br><span class="muted">Requirement: ${esc(x.pn)}</span></div>`).join('')||'<div class="muted">New scans appear here with actual P/N, requirement, operator, and timestamp.</div>'}</div></section></div></div>${footer('03')}`;}

function undoScan(){const ses=current(),x=ses.events.pop();if(!x)return;ses.counts[x.pn]--;ses.actual[x.pn][x.actual]--;if(!ses.actual[x.pn][x.actual])delete ses.actual[x.pn][x.actual];S.logs.unshift('Scan reversed with audit trail: '+x.actual);S.scanMessage='Last scan reversed. The audit history is retained.';S.scanClass='warn';render()}



function filterReady(v){S.query=v;$('readyRows').innerHTML=readyRows()}

const canManageChecklists=()=>['Sales Admin','Production Lead','Operations Lead'].includes(S.role);
const checklistStatus=t=>t.status||'Approved';
const partCodes=v=>[...new Set(String(v||'').split(/[|,;\n]+/).map(x=>x.trim().toUpperCase()).filter(Boolean))];

function acceptedPartCodes(b,k){let codes=[b.pn,...partCodes(b.alias)];if(!T[k].items&&b.canSkip)codes=codes.filter(p=>['PC71-CAN2019+P14','99G33-19A23C6','9V331909N0'].includes(p));return [...new Set(codes)]}
function checklistKey(){return S.checklistKey&&T[S.checklistKey]?S.checklistKey:'A'}

 return head('Shipment Checklist','Create separate checklists or revise an existing checklist',btn('Import checklist','importPreview()')+btn('+ New Shipment Checklist','newChecklist()','dark',!canManageChecklists()))+`
 <section class="card"><div class="tablewrap"><table><thead><tr><th>Checklist</th><th>SKU</th><th>Revision</th><th>Configuration</th><th>Status</th><th></th></tr></thead><tbody>${Object.entries(T).map(([key,c])=>`<tr class="${key===k?'line-select':''}"><td>${esc(c.name)}<div class="muted mono">${esc(c.id)}</div></td><td class="mono">${esc(c.sku)}</td><td>${esc(c.revision)}</td><td>${esc(c.variant)}</td><td>${tag(checklistStatus(c),checklistStatus(c)==='Approved'?'green':'amber')}</td><td>${btn('View',`templateDetail('${key}')`,'link')}${checklistStatus(c)==='Draft'?btn('Edit draft',`editChecklist('${key}')`,'link',!canManageChecklists()):btn('New revision',`newRevision('${key}')`,'link',!canManageChecklists())}</td></tr>`).join('')}</tbody></table></div><div class="note">New Shipment Checklist creates a separate checklist with its own ID and revision R1. New revision updates an existing checklist. Approved versions already attached to units stay unchanged.</div></section>
 <section class="card"><div class="cardhead"><h2>Equivalent Parts — ${esc(t.name)}</h2>${tag(t.revision+' · '+checklistStatus(t),checklistStatus(t)==='Approved'?'green':'amber')}</div><div class="note green">Primary and approved equivalent parts share one required quantity. Example: required quantity 2 = 1 primary + 1 equivalent, or 2 equivalents. Actual scanned P/Ns remain recorded. Extra scans do not increase the required quantity.</div><div class="tablewrap"><table><thead><tr><th>Requirement P/N</th><th>Accepted equivalent P/Ns</th><th class="num">Shared required qty</th><th></th></tr></thead><tbody>${equivs.map(b=>`<tr><td class="mono">${esc(b.pn)}</td><td><div class="chips">${acceptedPartCodes(b,k).filter(p=>p!==b.pn).map(p=>`<span class="pill">${esc(p)}</span>`).join('')}</div></td><td class="num">${b.qty}</td><td>${btn('Details',`equivalents('${b.pn}','${k}')`,'link')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No equivalents defined for this checklist. Add accepted P/Ns in its draft.</td></tr>'}</tbody></table></div><div class="muted" style="margin-top:12px">Equivalent rules apply only to this checklist revision and approved configuration.</div></section>${footer('05')}`;
}
function newChecklist(){
 if(!canManageChecklists())return;
 modal('New Shipment Checklist',`<div class="fields two"><div><label for="checkName">Checklist name</label><input id="checkName" placeholder="e.g. Republic Service Kit"></div><div><label for="checkSKU">SKU</label><select id="checkSKU">${[...new Set(Object.values(T).map(t=>t.sku))].map(sku=>`<option>${esc(sku)}</option>`).join('')}</select></div><div><label for="checkVariant">Configuration / applicability</label><input id="checkVariant" value="Standard"></div><div><label for="checkBase">Start from</label><select id="checkBase"><option value="">Blank checklist</option>${Object.entries(T).filter(([,t])=>checklistStatus(t)==='Approved').map(([key,t])=>`<option value="${key}">${esc(t.name)} · ${t.revision}</option>`).join('')}</select></div></div><div class="note">Creates a separate checklist ID at R1. Add required parts, quantities and accepted equivalents in the draft.</div>`,btn('Cancel','closeModal()')+btn('Create checklist','createChecklist()','blue'));
}
function copyChecklistItems(k){return requirements(k).map(b=>({...b,alias:acceptedPartCodes(b,k).filter(p=>p!==b.pn).join('|'),canSkip:false}))}
function nextChecklistKey(){let n=Object.keys(T).length+1;while(T['D'+n])n++;return 'D'+n}
function createChecklist(){
 if(!canManageChecklists())return;
 const name=$('checkName').value.trim(),sku=$('checkSKU').value,variant=$('checkVariant').value.trim(),base=$('checkBase').value;if(!name||!variant)return toast('Enter a checklist name and configuration.');
 const key=nextChecklistKey();T[key]={id:'PK-NEW-'+key.slice(1).padStart(3,'0'),name,sku,variant,revision:'R1',status:'Draft',qty:0,items:base?copyChecklistItems(base):[]};S.checklistKey=key;closeModal();render();editChecklist(key);
}

 S.checklistDraft={key,...JSON.parse(JSON.stringify(T[key]))};if(!S.checklistDraft.items.length)S.checklistDraft.items.push({pn:'',desc:'',qty:1,req:'Y',alias:''});drawChecklistEditor();
}

 modal('Edit Shipment Checklist',`<div class="fields two"><div><label for="draftName">Checklist name</label><input id="draftName" value="${esc(d.name)}" oninput="S.checklistDraft.name=this.value"></div><div><label>Checklist / revision</label><div class="value mono">${esc(d.id)} / ${esc(d.revision)} · Draft</div></div><div><label for="draftVariant">Configuration / applicability</label><input id="draftVariant" value="${esc(d.variant)}" oninput="S.checklistDraft.variant=this.value"></div><div><label>SKU</label><div class="value mono">${esc(d.sku)}</div></div></div><div class="cardhead" style="margin-top:20px"><h2>Checklist requirements</h2>${btn('+ Add requirement','addChecklistRequirement()')}</div>${d.items.map((b,i)=>`<div style="border:1px solid #e3e3e3;border-radius:4px;padding:14px;margin-bottom:12px"><div class="split"><b>Requirement ${i+1}</b>${btn('Remove',`removeChecklistRequirement(${i})`,'link')}</div><div class="fields two" style="margin-top:10px"><div><label for="draftPN${i}">Primary P/N ${i+1}</label><input id="draftPN${i}" value="${esc(b.pn)}" oninput="S.checklistDraft.items[${i}].pn=this.value"></div><div><label for="draftQty${i}">Required qty ${i+1}</label><input id="draftQty${i}" type="number" min="1" step="1" value="${b.qty}" oninput="S.checklistDraft.items[${i}].qty=Number(this.value);document.getElementById('draftQtyHint${i}').textContent=this.value||'—'"></div><div><label for="draftDesc${i}">Description ${i+1}</label><input id="draftDesc${i}" value="${esc(b.desc||'')}" oninput="S.checklistDraft.items[${i}].desc=this.value"></div><div><label for="draftMethod${i}">Verification method ${i+1}</label><select id="draftMethod${i}" onchange="S.checklistDraft.items[${i}].req=this.value"><option value="Y" ${b.req==='Y'?'selected':''}>Barcode scan</option><option value="N" ${b.req==='N'?'selected':''}>Upstream verification</option></select></div></div><label for="draftAlias${i}" style="margin-top:12px">Equivalent P/Ns ${i+1} (comma separated)</label><input id="draftAlias${i}" style="width:100%" value="${esc(partCodes(b.alias).join(', '))}" oninput="S.checklistDraft.items[${i}].alias=this.value"><div class="muted" style="margin-top:9px">Primary + approved equivalents count together toward quantity <span id="draftQtyHint${i}">${b.qty}</span>. Any mix is allowed within this configuration.</div></div>`).join('')}<div class="note">Use equivalents approved for this configuration. One barcode can belong to only one requirement in this checklist. Operations Lead approves a draft before production use.</div>`,btn('Cancel','closeModal()')+btn('Save draft','saveChecklist(false)','blue')+btn('Approve checklist','saveChecklist(true)','dark',!canApprove()));

function removeChecklistRequirement(i){S.checklistDraft.items.splice(i,1);drawChecklistEditor()}
function validateChecklistDraft(d,approve){
 if(!d.name.trim()||!d.variant.trim())return 'Checklist name and configuration are required.';
 if(approve&&!d.items.length)return 'Add at least one requirement before approval.';
 const seen=new Map(),validCode=/^[A-Z0-9][A-Z0-9+._/\-]*$/;
 for(let i=0;i<d.items.length;i++){
  const b=d.items[i];b.pn=b.pn.trim().toUpperCase();b.alias=partCodes(b.alias).filter(p=>p!==b.pn).join('|');b.canSkip=false;
  if(!validCode.test(b.pn))return 'Enter a valid primary P/N for requirement '+(i+1)+'.';
  if(!Number.isInteger(b.qty)||b.qty<1)return 'Required quantities must be positive whole numbers.';
  for(const code of [b.pn,...partCodes(b.alias)]){if(!validCode.test(code))return 'Invalid P/N: '+code;if(seen.has(code))return code+' appears in more than one requirement. Resolve it before saving.';seen.set(code,i)}
 }
 return '';
}
function saveChecklist(approve){
 if(!canManageChecklists()||(approve&&!canApprove()))return;
 const d=JSON.parse(JSON.stringify(S.checklistDraft)),original=T[d.key];if(checklistStatus(original)!=='Draft')return toast('Approved checklists are read-only. Create a revision.');
 const error=validateChecklistDraft(d,approve);if(error)return toast(error);
 const key=d.key;delete d.key;d.name=d.name.trim();d.variant=d.variant.trim();d.status=approve?'Approved':'Draft';d.qty=d.items.filter(b=>b.req==='Y').reduce((n,b)=>n+b.qty,0);T[key]=d;S.checklistKey=key;closeModal();render();toast(approve?'Checklist approved for production.':'Checklist draft saved.');
}
function newRevision(key=checklistKey()){
 if(!canManageChecklists())return;const base=T[key];if(checklistStatus(base)!=='Approved')return toast('Create a revision from an approved checklist.');
 const revision='R'+(Math.max(...Object.values(T).filter(t=>t.id===base.id).map(t=>Number(t.revision.replace(/^R/,''))||0))+1),next=nextChecklistKey();T[next]={...JSON.parse(JSON.stringify(base)),revision,status:'Draft',items:copyChecklistItems(key)};S.checklistKey=next;render();editChecklist(next);
}
function templateDetail(k){
 S.checklistKey=k;render();const t=T[k];
 modal('Shipment Checklist Detail',`<div class="fields two"><div><label>Name</label>${esc(t.name)}</div><div><label>Checklist / revision</label><span class="mono">${esc(t.id)} / ${esc(t.revision)}</span></div><div><label>SKU</label><span class="mono">${esc(t.sku)}</span></div><div><label>Configuration</label>${esc(t.variant)}</div></div><div class="note">${checklistStatus(t)==='Draft'?'Draft — approval is required before production use.':'Approved version — existing unit and shipment records retain this version.'} Each row has one quantity shared by the primary and accepted equivalent parts.</div><div style="max-height:330px;overflow:auto"><table><thead><tr><th>Primary P/N</th><th class="num">Shared qty</th><th>Accepted equivalent P/Ns</th><th>Method</th></tr></thead><tbody>${requirements(k).map(b=>`<tr><td class="mono">${esc(b.pn)}</td><td class="num">${b.qty}</td><td class="mono">${acceptedPartCodes(b,k).filter(p=>p!==b.pn).map(esc).join('<br>')||'—'}</td><td>${b.req==='Y'?'Barcode scan':'Upstream verification'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No requirements yet</td></tr>'}</tbody></table></div>`,btn('Close','closeModal()')+(checklistStatus(t)==='Draft'?btn('Edit draft',`editChecklist('${k}')`,'blue',!canManageChecklists()):btn('New revision',`newRevision('${k}')`,'blue',!canManageChecklists())));
}
function equivalents(pn,k=S.page==='packing'?unit().t:checklistKey()){
 const b=requirements(k).find(b=>b.pn===pn);if(!b)return;const codes=acceptedPartCodes(b,k);
 modal('Equivalent Part Rules',`<div class="fields two"><div><label>Checklist / revision</label><span class="mono">${esc(T[k].id)} / ${esc(T[k].revision)}</span></div><div><label>Shared required quantity</label><b>${b.qty}</b></div></div><div class="chips" style="margin:16px 0">${codes.map(p=>`<span class="pill">${esc(p)}</span>`).join('')}</div><div class="note green">Any combination of these approved P/Ns satisfies the same required quantity of ${b.qty}. Scanning a primary or equivalent part adds one to this shared total. Scans above the requirement are rejected.</div><div class="small">Actual scanned P/Ns remain in the unit's scan history. Rules apply to ${esc(T[k].variant)} and this checklist revision only.</div>`,btn('Close','closeModal()')+(checklistStatus(T[k])==='Approved'?btn('New revision',`newRevision('${k}')`,'blue',!canManageChecklists()):btn('Edit draft',`editChecklist('${k}')`,'blue',!canManageChecklists())));
}
function scanPart(raw){
 if(!canPack()||unit().ready)return;
 if(checklistStatus(T[unit().t])!=='Approved'){S.scanMessage='Checklist is still a draft. Approve it before packing.';S.scanClass='bad';render();return}
 const code=raw.trim().toUpperCase(),candidates=requirements(unit().t).filter(b=>acceptedPartCodes(b,unit().t).includes(code));let error='',b=candidates[0];
 if(candidates.length!==1)error='Barcode is unknown, ambiguous, or not approved for this checklist configuration. No quantity added.';
 else if(b.req==='N')error='This part is covered by upstream verification. A packing scan cannot double-count it.';
 else if((current().counts[b.pn]||0)>=b.qty)error='Required quantity already met. Extra part was not counted.';
 if(error){S.scanMessage=error;S.scanClass='bad';render();$('scan')?.focus();return}
 const ses=current();ses.counts[b.pn]=(ses.counts[b.pn]||0)+1;ses.actual[b.pn]??={};ses.actual[b.pn][code]=(ses.actual[b.pn][code]||0)+1;ses.events.push({pn:b.pn,actual:code,time:new Date().toLocaleTimeString(),actorId:currentActor().id,actorName:currentActor().name});S.scanMessage=`Accepted ${code}${code!==b.pn?' as an equivalent for '+b.pn:''}. Shared quantity: ${ses.counts[b.pn]} / ${b.qty}.`;S.scanClass='ok';render();$('scan')?.focus();
}

function importPreview(){modal('Import Preview',`<div class="fields two"><div><label>Import type</label><select><option>Packing Checklist</option><option>Component Records</option></select></div><div><label>Source</label><div class="value">Junjie scan-check workbook (reference)</div></div></div><div class="note">Illustrative validation preview: 48 checklist lines, 67 primary/alias codes. 13 No need to scan lines require an approved verification method. Component imports retain their original files and do not mark packing complete.</div><table><thead><tr><th>Validation</th><th>Result</th></tr></thead><tbody><tr><td>P/N and quantity fields</td><td>${tag('Mapped','green')}</td></tr><tr><td>Vehicle CAN applicability</td><td>${tag('Needs review','amber')}</td></tr><tr><td>Upstream verification mapping</td><td>${tag('Needs review','amber')}</td></tr></tbody></table>`,btn('Close','closeModal()')+btn('Apply import','', 'blue',true))}
function history(){if(unit().id!=='U1')return head('Unit Details',unit().serial+' · '+unit().mac,btn('Back to packing',`openPacking('${unit().id}')`))+`<section class="card"><h2>${T[unit().t].id}</h2><p>Readiness: ${unit().ready?'Ready':'In Progress'}. Reservation: ${unit().assigned||'Unassigned'}.</p><p>No serial discrepancy is modeled for this illustrative unit. Open M820P-DEMO-0001 to review the component-change example.</p>${btn('Open serial review example',"S.activeUnit='U1';go('history')",'blue')}</section>`;return head('Unit Details','M820P-DEMO-0001 · 020000000001',btn('Back to packing',"openPacking('U1')"))+`<section class="card"><div class="fields"><div><label>SKU</label><div class="value mono">${T.A.sku}</div></div><div><label>Original Taiwan Record</label><div class="value">TW-DEMO-IMPORT-001</div></div><div><label>Latest Configuration</label><div class="value">${S.serialHold?'Review pending':'Confirmed'}</div></div><div><label>Customer Assignment</label><div class="value">${units[0].assigned?'DEMO-SO-001 / '+units[0].assigned:'Not assigned'}</div></div></div></section><section class="card"><div class="tabs">${[['components','Components'],['imports','Imports & Original'],['packing','Packing History'],['audit','Change Log']].map(([k,v])=>`<button class="tab ${S.historyTab===k?'active':''}" onclick="S.historyTab='${k}';render()">${v}</button>`).join('')}</div>${historyBody()}</section>${footer('06')}`}
function historyBody(){if(S.historyTab==='components')return `<div class="cardhead"><h2>Original, Verified, and Detected Components</h2>${tag(S.serialHold?'1 change requires review':'No pending changes',S.serialHold?'amber':'green')}</div><table><thead><tr><th>Component</th><th>Taiwan Original S/N</th><th>Verified S/N</th><th>Latest Detected S/N</th><th>Review</th></tr></thead><tbody><tr><td>Front camera</td><td class="mono">CAM-DEMO-0010</td><td class="mono">${S.serialHold?'CAM-DEMO-0010':'CAM-DEMO-0044'}</td><td class="mono">CAM-DEMO-0044</td><td>${tag(hasSerialHold()?'Pending':'Confirmed',hasSerialHold()?'amber':'green')}</td></tr><tr><td>Radar - left</td><td class="mono">RAD-DEMO-0021</td><td class="mono">RAD-DEMO-0021</td><td class="mono">RAD-DEMO-0021</td><td>${tag('Unchanged','gray')}</td></tr></tbody></table><div class="note amber">Latest detected serials are observations. Confirm a change with a reason; the original import and any dispatch snapshot stay unchanged.</div><div class="fields two"><div><label for="reason">Change reason</label><select id="reason" ${!canApprove()?'disabled':''}><option>Replacement</option><option>Planned Reconfiguration</option><option>Data Correction</option></select></div><div><label for="reviewNote">Review note</label><input id="reviewNote" placeholder="e.g. replacement confirmed during test" ${!canApprove()?'disabled':''}></div></div><div class="actions" style="margin-top:18px">${btn('Confirm Change','confirmSerial()','blue',!canApprove()||!S.serialHold)}${!canApprove()?'<span class="muted">Operations Lead permission is required.</span>':''}</div>`;
if(S.historyTab==='imports')return `<table><thead><tr><th>Record</th><th>Source File</th><th>Uploaded By</th><th>Scope</th><th>Status</th></tr></thead><tbody><tr><td>TW-DEMO-IMPORT-001</td><td>Taiwan_Original_Packing_DEMO.xlsx</td><td>Demo Taiwan Operations</td><td>Original received configuration</td><td>${tag('Read-only original','gray')}</td></tr><tr><td>FM-DEMO-IMPORT-002</td><td>Fremont_Component_Update_DEMO.xlsx</td><td>Demo Operations</td><td>Latest confirmed update</td><td>${tag('History retained')}</td></tr></tbody></table><div class="note">Files are illustrative labels. Production stores the actual source file, hash, uploader, time, row result, and affected unit IDs.</div>`;
if(S.historyTab==='packing')return `<table><thead><tr><th>Attempt</th><th>Checklist</th><th>Result</th><th>Seal</th><th>Shipment</th></tr></thead><tbody><tr><td>PA-DEMO-001</td><td>${T.A.id}</td><td>${tag(units[0].ready?'Verified':'In Progress',units[0].ready?'green':'amber')}</td><td>${units[0].seal?'Intact':'Pending'}</td><td>${units[0].assigned||'Unassigned'}</td></tr></tbody></table><div class="note">New rework attempts retain previous scan events and evidence. Changing the unit ID never moves scans to a different controller.</div>`;
return `<div class="timeline"><div><time>Illustrative original import</time>Original packing received from Taiwan; file and serial references preserved.</div><div><time>Illustrative system observation</time>Front camera changed from CAM-DEMO-0010 to CAM-DEMO-0044. Review opened.</div>${S.logs.map(v=>`<div><time>Demo session</time>${esc(v)}</div>`).join('')}${S.assignLogs.map(v=>`<div><time>Allocation event</time>${esc(v)}</div>`).join('')}</div>`;}
function confirmSerial(){if(!canApprove())return;S.serialHold=false;S.logs.unshift('Operations Lead confirmed camera change. Reason: '+$('reason').value+'. '+($('reviewNote').value||'Demo review'));toast('Change confirmed. Original serial retained; release hold cleared.');render()}
function guide(){return head('Prototype Guide','PC + USB scanner · two-week implementation')+`<section class="card guide"><h2>New pack job walkthrough</h2><ol><li>Start as Production Lead and choose New Pack Job. Quick Scanner Demo Kit needs three scans; full checklist examples are also available.</li><li>Create the job, then add registered sample Controller MAC <span class="mono">020000000006</span> (or another available sample shown in the job).</li><li>Open packing. Scan/type <span class="mono">99G33-19B73C6</span>, <span class="mono">PC71-RADINTC-10M</span>, and <span class="mono">DEMO-PACK-LABEL</span>. Press Enter/Tab or Add scan. The primary/equivalent cable scans share quantity 2.</li><li>Confirm the seal and Verify &amp; Mark Ready. Ready Inventory records the acting verifier. Switch to Sales Admin to add the Controller to a shipment and export Excel.</li></ol><h2>Justin: shipment walkthrough</h2><ol><li><b>All Shipments:</b> search customer, SO, PO, site or MAC ID. Filter by customer/status and sort by customer or target date. Export Excel uses the filtered list.</li><li><b>New Shipment:</b> select an existing customer and its existing site, then enter SO, PO and target ship date. Create the shipment first, then scan Controller IDs or select confirmed Ready controllers. SKU and packing records attach automatically.</li><li><b>Add units:</b> scan a Controller ID (MAC ID) or select controllers from Ready Inventory. No shipment-line or packing-list selection is required. Try <span class="mono">020000000002</span> for checklist PK-FEL-R6. Unknown, held, unsealed and already-allocated controllers are blocked. Any existing SO/PO requirements are checked automatically.</li><li><b>Ship and export:</b> enter the actual ship date and confirm dispatch once all intended controllers have been added. Export Excel creates tracking blocks like the reference screenshot and a filterable unit list. Open DEMO-SHP-002 for a completed example.</li></ol><h2>Shipment Checklist</h2><p>Use New Shipment Checklist to create a separate checklist ID at R1, starting blank or copying an approved checklist. Add primary parts, quantities and accepted equivalents. Sales Admin, Production Lead or Operations Lead can prepare drafts; Operations Lead approves them. New revision keeps the same checklist identity and leaves existing packed units unchanged. Primary and equivalent scans share one required quantity.</p><h2>Ready Inventory</h2><p>The table shows who verified and marked each unit Ready, with the date/time. Reopening keeps the previous verification in history and requires a new sign-off. The role selector uses illustrative demo identities.</p><h2>Packing walkthrough</h2><p>Select Packing Operator, open Packaging / U1, and scan <span class="mono">PC71-RADINTC-10M</span> and <span class="mono">PC71-CAN2019+P14</span>. Switch to Operations Lead to confirm the serial change with a reason. Return to packing, confirm sealing, and mark Ready. Packing evidence follows the unit into shipment.</p><div class="note">All orders, locations and MAC IDs are illustrative. P/N examples come from Junjie's supplied files. Demo jobs, scans, checklists and shipments are saved in this browser. Other viewers have their own demo data. This prototype has no production API connection. The role selector demonstrates permissions. ${btn('Reset demo','resetDemo()','danger')}</div></section>`}

function modal(title,body,foot){$('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><span>${title}</span>${btn('×','closeModal()','link')}</div>${body}<div class="modalfoot">${foot}</div></section></div>`}
function closeModal(){$('modal').innerHTML=''}
function render(){if($('previewUser'))$('previewUser').textContent='◉ '+currentActor().name+'⌄';nav();$('app').innerHTML=({shipments,shipment:shipmentDetails,packjobs:packJobs,packjob:packJobDetails,packing,ready,templates,history,guide}[S.page]||shipments)();$('role').value=S.role;persistDemoState();}
restoreDemoState();
$('role').onchange=e=>{S.role=e.target.value;render();toast('Previewing '+S.role+' permissions')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if(['shipments','shipment','packjobs','packjob','packing','ready','templates','history','guide'].includes(location.hash.slice(1)))S.page=location.hash.slice(1);if(!S.restored&&['shipments','shipment'].includes(S.page))S.role='Sales Admin';render();
</script></body></html>
